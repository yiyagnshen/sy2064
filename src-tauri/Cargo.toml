[package]
name = "v-pro-video-batch-tool"
version = "0.1.0"
description = "Windows video batch processing tool"
authors = ["V Pro"]
edition = "2021"

[lib]
name = "v_pro_video_batch_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
